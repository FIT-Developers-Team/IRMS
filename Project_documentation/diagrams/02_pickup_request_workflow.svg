<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 480" width="100%" height="100%" style="background-color: #ffffff; font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;">
  <defs>
    <linearGradient id="pGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#1565c0"/><stop offset="100%" stop-color="#0d47a1"/></linearGradient>
    <linearGradient id="sGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#10b981"/><stop offset="100%" stop-color="#059669"/></linearGradient>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.08"/></filter>
  </defs>

  <rect x="20" y="15" width="810" height="42" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="425" y="42" fill="#1e40af" font-size="16" font-weight="800" text-anchor="middle">Workflow 2: Pickup Request Creation &amp; Data Dispatch</text>

  <!-- Step 1 -->
  <rect x="40" y="85" width="220" height="60" rx="14" fill="url(#pGrad)" filter="url(#sh)"/>
  <text x="150" y="112" fill="#ffffff" font-size="13" font-weight="800" text-anchor="middle">1. Click + New Request</text>
  <text x="150" y="129" fill="#dbeafe" font-size="11" font-weight="600" text-anchor="middle">Open Request Modal</text>

  <line x1="260" y1="115" x2="310" y2="115" stroke="#2563eb" stroke-width="2"/>
  <polygon points="315,115 305,110 305,120" fill="#2563eb"/>

  <!-- Step 2 -->
  <rect x="315" y="85" width="220" height="60" rx="14" fill="#ffffff" stroke="#2563eb" stroke-width="2" filter="url(#sh)"/>
  <text x="425" y="112" fill="#1e40af" font-size="13" font-weight="800" text-anchor="middle">2. Auto Ticket ID</text>
  <text x="425" y="129" fill="#64748b" font-size="11" font-weight="600" text-anchor="middle">#RC-XXXXXX Generated</text>

  <line x1="535" y1="115" x2="585" y2="115" stroke="#2563eb" stroke-width="2"/>
  <polygon points="590,115 580,110 580,120" fill="#2563eb"/>

  <!-- Step 3 -->
  <rect x="590" y="85" width="220" height="60" rx="14" fill="#ffffff" stroke="#2563eb" stroke-width="2" filter="url(#sh)"/>
  <text x="700" y="112" fill="#1e40af" font-size="13" font-weight="800" text-anchor="middle">3. Select SKU Code</text>
  <text x="700" y="129" fill="#64748b" font-size="11" font-weight="600" text-anchor="middle">Auto-fill Product Details</text>

  <line x1="700" y1="145" x2="700" y2="200" stroke="#2563eb" stroke-width="2"/>
  <polygon points="700,205 695,195 705,195" fill="#2563eb"/>

  <!-- Step 4 -->
  <rect x="590" y="205" width="220" height="60" rx="14" fill="#ffffff" stroke="#2563eb" stroke-width="2" filter="url(#sh)"/>
  <text x="700" y="232" fill="#1e40af" font-size="13" font-weight="800" text-anchor="middle">4. Select Checker Line</text>
  <text x="700" y="249" fill="#64748b" font-size="11" font-weight="600" text-anchor="middle">Chip Modal Picker</text>

  <line x1="590" y1="235" x2="540" y2="235" stroke="#2563eb" stroke-width="2"/>
  <polygon points="535,235 545,230 545,240" fill="#2563eb"/>

  <!-- Step 5 -->
  <rect x="315" y="205" width="220" height="60" rx="14" fill="#ffffff" stroke="#2563eb" stroke-width="2" filter="url(#sh)"/>
  <text x="425" y="232" fill="#1e40af" font-size="13" font-weight="800" text-anchor="middle">5. Input Qty &amp; Notes</text>
  <text x="425" y="249" fill="#64748b" font-size="11" font-weight="600" text-anchor="middle">Validate Qty &gt; 0</text>

  <line x1="315" y1="235" x2="265" y2="235" stroke="#2563eb" stroke-width="2"/>
  <polygon points="260,235 270,230 270,240" fill="#2563eb"/>

  <!-- Step 6 -->
  <rect x="40" y="205" width="220" height="60" rx="14" fill="#ffffff" stroke="#10b981" stroke-width="2" filter="url(#sh)"/>
  <text x="150" y="232" fill="#065f46" font-size="13" font-weight="800" text-anchor="middle">6. Set Status = Pending</text>
  <text x="150" y="249" fill="#047857" font-size="11" font-weight="600" text-anchor="middle">Prepare GAS Payload</text>

  <line x1="150" y1="265" x2="150" y2="320" stroke="#10b981" stroke-width="2"/>
  <polygon points="150,325 145,315 155,315" fill="#10b981"/>

  <!-- Step 7 -->
  <rect x="40" y="325" width="380" height="65" rx="14" fill="url(#sGrad)" filter="url(#sh)"/>
  <text x="230" y="354" fill="#ffffff" font-size="14" font-weight="800" text-anchor="middle">7. Sync to Google Sheets Request_Checker</text>
  <text x="230" y="373" fill="#e6fffa" font-size="12" font-weight="600" text-anchor="middle">Append Row &amp; Update IndexedDB Local Cache</text>
</svg>