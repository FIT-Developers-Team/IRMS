<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 540" width="100%" height="100%" style="background-color: #ffffff; font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;">
  <defs>
    <linearGradient id="pGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#1565c0"/><stop offset="100%" stop-color="#0d47a1"/></linearGradient>
    <linearGradient id="sGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#10b981"/><stop offset="100%" stop-color="#059669"/></linearGradient>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.08"/></filter>
  </defs>

  <!-- Title Header -->
  <rect x="20" y="15" width="810" height="42" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="425" y="42" fill="#1e40af" font-size="16" font-weight="800" text-anchor="middle">Workflow 1: User Authentication &amp; Session Lifecycle</text>

  <!-- Node 1: Launch -->
  <rect x="295" y="80" width="260" height="44" rx="22" fill="url(#pGrad)" filter="url(#sh)"/>
  <text x="425" y="107" fill="#ffffff" font-size="13" font-weight="800" text-anchor="middle">Launch Application / Main Load</text>

  <line x1="425" y1="124" x2="425" y2="155" stroke="#64748b" stroke-width="2"/>
  <polygon points="425,160 420,150 430,150" fill="#64748b"/>

  <!-- Node 2: Check Session -->
  <polygon points="425,160 550,195 425,230 300,195" fill="#ffffff" stroke="#2563eb" stroke-width="2" filter="url(#sh)"/>
  <text x="425" y="191" fill="#1e293b" font-size="12" font-weight="800" text-anchor="middle">Valid Session in</text>
  <text x="425" y="206" fill="#1e293b" font-size="12" font-weight="800" text-anchor="middle">localStorage?</text>

  <!-- Branch YES (Left) -->
  <line x1="300" y1="195" x2="170" y2="195" stroke="#10b981" stroke-width="2"/>
  <line x1="170" y1="195" x2="170" y2="260" stroke="#10b981" stroke-width="2"/>
  <polygon points="170,265 165,255 175,255" fill="#10b981"/>
  <rect x="200" y="177" width="48" height="22" rx="6" fill="#ecfdf5"/><text x="224" y="192" fill="#047857" font-size="11" font-weight="800" text-anchor="middle">YES</text>

  <rect x="60" y="265" width="220" height="54" rx="12" fill="#ffffff" stroke="#10b981" stroke-width="2" filter="url(#sh)"/>
  <text x="170" y="287" fill="#065f46" font-size="12" font-weight="800" text-anchor="middle">Hydrate IndexedDB Cache</text>
  <text x="170" y="304" fill="#047857" font-size="11" font-weight="600" text-anchor="middle">0ms Instant Startup</text>

  <line x1="170" y1="319" x2="170" y2="365" stroke="#10b981" stroke-width="2"/>
  <polygon points="170,370 165,360 175,360" fill="#10b981"/>

  <rect x="60" y="370" width="220" height="54" rx="12" fill="url(#sGrad)" filter="url(#sh)"/>
  <text x="170" y="394" fill="#ffffff" font-size="13" font-weight="800" text-anchor="middle">Render Dashboard UI</text>
  <text x="170" y="411" fill="#e6fffa" font-size="11" font-weight="600" text-anchor="middle">Operational View Ready</text>

  <!-- Branch NO (Right) -->
  <line x1="550" y1="195" x2="680" y2="195" stroke="#ef4444" stroke-width="2"/>
  <line x1="680" y1="195" x2="680" y2="260" stroke="#ef4444" stroke-width="2"/>
  <polygon points="680,265 675,255 685,255" fill="#ef4444"/>
  <rect x="600" y="177" width="48" height="22" rx="6" fill="#fef2f2"/><text x="624" y="192" fill="#b91c1c" font-size="11" font-weight="800" text-anchor="middle">NO</text>

  <rect x="570" y="265" width="220" height="54" rx="12" fill="#ffffff" stroke="#ef4444" stroke-width="2" filter="url(#sh)"/>
  <text x="680" y="287" fill="#991b1b" font-size="12" font-weight="800" text-anchor="middle">Render Login Screen</text>
  <text x="680" y="304" fill="#7f1d1d" font-size="11" font-weight="600" text-anchor="middle">Input Staff Name &amp; Password</text>

  <line x1="680" y1="319" x2="680" y2="365" stroke="#ef4444" stroke-width="2"/>
  <polygon points="680,370 675,360 685,360" fill="#ef4444"/>

  <polygon points="680,370 780,405 680,440 580,405" fill="#ffffff" stroke="#ea580c" stroke-width="2" filter="url(#sh)"/>
  <text x="680" y="401" fill="#7c2d12" font-size="11" font-weight="800" text-anchor="middle">Valid Match in</text>
  <text x="680" y="415" fill="#7c2d12" font-size="11" font-weight="800" text-anchor="middle">User_DB?</text>

  <line x1="580" y1="405" x2="425" y2="405" stroke="#10b981" stroke-width="2"/>
  <line x1="425" y1="405" x2="425" y2="397" stroke="#10b981" stroke-width="2"/>
  <line x1="425" y1="397" x2="290" y2="397" stroke="#10b981" stroke-width="2"/>
  <polygon points="285,397 295,392 295,402" fill="#10b981"/>

  <line x1="780" y1="405" x2="810" y2="405" stroke="#dc2626" stroke-width="2"/>
  <line x1="810" y1="405" x2="810" y2="292" stroke="#dc2626" stroke-width="2"/>
  <line x1="810" y1="292" x2="795" y2="292" stroke="#dc2626" stroke-width="2"/>
  <polygon points="790,292 800,287 800,297" fill="#dc2626"/>
</svg>